name: backend-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg14
        env:
          POSTGRES_USER: migration_ci
          POSTGRES_PASSWORD: migration_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://migration_ci:migration_ci_password@localhost:5432/postgres
      MIGRATION_ADMIN_URL: postgresql://migration_ci:migration_ci_password@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            constraints-ci.txt
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --constraint constraints-ci.txt -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Compile Python sources
        run: |
          PYTHONPYCACHEPREFIX=/tmp python -m compileall -q app tests scripts/python migrations

      - name: Ruff regression gate
        run: |
          python scripts/python/check_ruff_regressions.py

      - name: Report complete Ruff debt
        continue-on-error: true
        run: |
          ruff check app tests

      - name: Mypy configured scope
        run: |
          mypy

      - name: Development config check
        run: |
          cp env.example .env
          python scripts/python/check_config.py

      - name: Production readiness check
        run: |
          python scripts/python/check_production_readiness.py --env-file env.prod.example

      - name: Verify deterministic migrations
        run: |
          python -m pytest -q tests/test_migration_baseline_contract.py tests/test_postgres_migration_verifier.py
          python scripts/python/verify_postgres_migrations.py --admin-url "$MIGRATION_ADMIN_URL"

      - name: Run backend tests with coverage
        run: |
          BACKEND_COVERAGE_FAIL_UNDER=57 BACKEND_COVERAGE_XML=true bash ./scripts/shell/run_backend_coverage.sh

      - name: Build backend image
        run: |
          docker build -t mineenergysystem-backend:ci .

      - name: Validate production compose
        run: |
          docker compose -f docker-compose.prod.yml --env-file env.prod.example config >/tmp/mine_compose_config.out

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: mineenergysystem-backend:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-xml
          path: coverage.xml
