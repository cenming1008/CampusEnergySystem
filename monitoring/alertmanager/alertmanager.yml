global:
  resolve_timeout: 5m

route:
  receiver: active-channel
  group_by: ["alertname"]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  - name: active-channel
    webhook_configs:
      - url: "https://hooks.example.com/replace-with-real-channel"
        send_resolved: true
