global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "mine-backend"
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8088

  - job_name: "prometheus"
    static_configs:
      - targets:
          - localhost:9090

