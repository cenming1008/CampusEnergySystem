groups:
  - name: mine_energy_backend
    rules:
      - alert: MineBackendDown
        expr: up{job="mine-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MineEnergySystem backend is down"
          description: "Prometheus cannot scrape the backend /metrics endpoint for more than 1 minute."

      - alert: MineHighHttpErrorRate
        expr: |
          sum(rate(mine_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(mine_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MineEnergySystem HTTP 5xx rate is high"
          description: "More than 5% of HTTP requests returned 5xx in the last 5 minutes."

      - alert: MineHighHttpLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(mine_http_request_duration_seconds_bucket[5m])) by (le, path)
          ) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "MineEnergySystem HTTP p95 latency is high"
          description: "HTTP p95 latency exceeded 1.5 seconds for at least 10 minutes."

      - alert: MineMqttIngestionFailures
        expr: increase(mine_mqtt_messages_total{status=~"failed|validation_failed"}[10m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MQTT ingestion failures are increasing"
          description: "MQTT ingestion has produced more than 10 failed messages in 10 minutes."

      - alert: MineSchedulerFailures
        expr: increase(mine_scheduler_job_runs_total{outcome="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job failures detected"
          description: "At least one scheduler job has failed in the last 15 minutes."

      - alert: MineRuntimeServiceUnhealthy
        expr: mine_runtime_service_status < 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "A runtime dependency is unhealthy"
          description: "One or more backend runtime services are reported unhealthy."

