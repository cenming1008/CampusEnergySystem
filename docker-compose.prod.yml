# ============================================
# 生产环境 Docker Compose 配置
# ============================================
# 使用方法：
# 1. 复制 .env.example 为 .env.prod
# 2. 修改 .env.prod 中的配置（密码、密钥等）
# 3. 运行: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# ============================================

services:
  # 1. 数据库 (TimescaleDB)
  db:
    image: timescale/timescaledb:2.17.2-pg14
    container_name: campus_energy_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: campus_energy
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d campus_energy"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # 2. 缓存 (Redis)
  redis:
    image: redis:7.0-alpine
    container_name: campus_redis_prod
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_data_prod:/data
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # 3. 消息队列 (MQTT)
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: campus_mqtt_prod
    restart: always
    # 生产环境不暴露 MQTT 到宿主机所有网卡（后端通过容器网络 app_network 访问）
    # 如需外部设备接入，取消注释并配合防火墙策略
    # ports:
    #   - "127.0.0.1:1883:1883"
    #   - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u ${MQTT_USERNAME:-campus_mqtt} -P ${MQTT_PASSWORD:-changeme} -t '$$SYS/#' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # 4. 后端应用 (FastAPI)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus_backend_prod
    restart: always
    environment:
      # 生产容器内互联继续使用 db / redis / mqtt 这些 service 名；campus_* 仅用于可见容器名
      # 数据库配置
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD}@db:5432/campus_energy
      # Redis配置
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      # MQTT配置
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-campus_mqtt}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC=${MQTT_TOPIC:-campus/telemetry}
      - MQTT_TOPIC_WILDCARD=${MQTT_TOPIC_WILDCARD:-campus/device/+/telemetry}
      - MQTT_CONTROL_TOPIC_PREFIX=${MQTT_CONTROL_TOPIC_PREFIX:-campus/control/}
      - MQTT_CONSUMER_ENABLED=False
      # JWT密钥（必须修改！）
      - SECRET_KEY=${SECRET_KEY}
      # 应用配置
      - DEBUG=False
      - APP_ENV=production
      - STRICT_STARTUP_CHECKS=True
      - DB_AUTO_CREATE_TABLES=False
      - DB_RUNTIME_SCHEMA_SYNC=False
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8088
      - WEBSOCKET_AUTH_MODE=${WEBSOCKET_AUTH_MODE:-query_token}
      - MONITORING_ACCESS_MODE=${MONITORING_ACCESS_MODE:-internal_or_jwt}
      - MONITORING_ACCESS_ROLES=${MONITORING_ACCESS_ROLES:-["admin","maintainer"]}
      # CORS配置（生产环境域名）
      - CORS_ORIGINS=${CORS_ORIGINS}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS}
      - FORCE_HTTPS=${FORCE_HTTPS:-True}
      # 运行时告警通知
      - ALERTING_ENABLED=${ALERTING_ENABLED:-False}
      - ALERTING_PROJECT_NAME=${ALERTING_PROJECT_NAME:-MineEnergySystem}
      - ALERTING_WEBHOOK_URL=${ALERTING_WEBHOOK_URL:-}
      - ALERTING_EMAIL_ENABLED=${ALERTING_EMAIL_ENABLED:-False}
      - ALERTING_SMTP_HOST=${ALERTING_SMTP_HOST:-}
      - ALERTING_SMTP_PORT=${ALERTING_SMTP_PORT:-587}
      - ALERTING_SMTP_USERNAME=${ALERTING_SMTP_USERNAME:-}
      - ALERTING_SMTP_PASSWORD=${ALERTING_SMTP_PASSWORD:-}
      - ALERTING_EMAIL_FROM=${ALERTING_EMAIL_FROM:-}
      - ALERTING_EMAIL_TO=${ALERTING_EMAIL_TO:-[]}
      - ALERTING_COOLDOWN_SECONDS=${ALERTING_COOLDOWN_SECONDS:-300}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  mqtt_ingest_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus_mqtt_ingest_worker_prod
    restart: always
    command: ["python", "scripts/python/run_mqtt_ingest_worker.py"]
    environment:
      # worker 容器内互联沿用 service 名，不跟随 campus_* 容器名变化
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD}@db:5432/campus_energy
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_USERNAME:-campus_mqtt}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC=${MQTT_TOPIC:-campus/telemetry}
      - MQTT_TOPIC_WILDCARD=${MQTT_TOPIC_WILDCARD:-campus/device/+/telemetry}
      - MQTT_CONTROL_TOPIC_PREFIX=${MQTT_CONTROL_TOPIC_PREFIX:-campus/control/}
      - MQTT_CONSUMER_ENABLED=True
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - APP_ENV=production
      - STRICT_STARTUP_CHECKS=True
      - DB_AUTO_CREATE_TABLES=False
      - DB_RUNTIME_SCHEMA_SYNC=False
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_healthy
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    container_name: campus_nginx_prod
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/log:/var/log/nginx
    networks:
      - app_network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: campus_prometheus_prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
      - --alertmanager.url=http://alertmanager:9093
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data_prod:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      alertmanager:
        condition: service_started
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - app_network

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: campus_alertmanager_prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    environment:
      - ALERTMANAGER_CHANNEL=${ALERTMANAGER_CHANNEL:-webhook}
      - ALERTMANAGER_WEBHOOK_URL=${ALERTMANAGER_WEBHOOK_URL:-}
      - ALERTMANAGER_EMAIL_TO=${ALERTMANAGER_EMAIL_TO:-}
      - ALERTMANAGER_EMAIL_FROM=${ALERTMANAGER_EMAIL_FROM:-}
      - ALERTMANAGER_SMARTHOST=${ALERTMANAGER_SMARTHOST:-}
      - ALERTMANAGER_AUTH_USERNAME=${ALERTMANAGER_AUTH_USERNAME:-}
      - ALERTMANAGER_AUTH_PASSWORD=${ALERTMANAGER_AUTH_PASSWORD:-}
    command:
      - /bin/sh
      - -c
      - /usr/local/bin/render_alertmanager_config.sh && /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - ./scripts/shell/render_alertmanager_config.sh:/usr/local/bin/render_alertmanager_config.sh:ro
      - alertmanager_data_prod:/alertmanager
    networks:
      - app_network

  loki:
    image: grafana/loki:3.1.1
    container_name: campus_loki_prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data_prod:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - app_network

  promtail:
    image: grafana/promtail:3.1.1
    container_name: campus_promtail_prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./logs:/var/log/mineenergy:ro
      - ./mosquitto/log:/var/log/mosquitto:ro
      - ./nginx/log:/var/log/nginx:ro
    depends_on:
      - loki
    networks:
      - app_network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: campus_grafana_prod
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - app_network

volumes:
  redis_data_prod:
    driver: local
  prometheus_data_prod:
    driver: local
  grafana_data_prod:
    driver: local
  loki_data_prod:
    driver: local
  alertmanager_data_prod:
    driver: local

networks:
  app_network:
    driver: bridge
